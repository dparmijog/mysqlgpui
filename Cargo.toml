[package]
name = "mysqlgpui"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/sqldr-core"]

# Shared by the app and sqldr-core (which inherits them with `.workspace = true`).
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"

[dependencies]
# UI-agnostic driver layer (Driver trait, MySQL/Postgres, guards, pagination),
# imported from the sqldr TUI with its history.
sqldr-core = { path = "crates/sqldr-core" }
gpui-kit = { version = "0.9", features = ["tree-sitter-sql"] }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
url = "2"
toml = "0.8"
directories = "5"
# Same version/features as sqldr so both apps read the same keyring entries.
keyring = { version = "3", features = ["sync-secret-service", "linux-native", "crypto-rust"] }
# Completion item types for the editor; same version gpui-component uses.
lsp-types = "0.97"

# gpui (layout, text shaping, rendering) is unusably slow unoptimized:
# dependencies get full optimizations even in `cargo run`, while this crate
# stays a fast-compiling debug build. Their debug info is dropped too: it
# was ~1 GB per binary, and stepping into optimized gpui/sqlx code isn't
# useful anyway. This crate keeps full debug info.
[profile.dev.package."*"]
opt-level = 3
debug = false
